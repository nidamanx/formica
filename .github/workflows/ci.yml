name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to a commit SHA (version in the comment); Dependabot updates both
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No keys or secrets in the repository
        run: scripts/check-secrets.sh

  # Add the project's jobs here (lint, tests, build), each with the same pinned checkout
