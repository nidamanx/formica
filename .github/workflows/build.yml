# Lint, unit tests, debug and release builds and the permission check on every push to
# main or develop and on pull requests; the debug APK is kept as an artifact.
name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running build pointless; manual runs are never cancelled
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version matches in every file
        run: scripts/check-version.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Actions are pinned to a commit SHA (version in the comment); Dependabot updates both
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No keys or secrets in the repository
        run: scripts/check-secrets.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT-licensed cache: the default "enhanced" one is proprietary since v6
          cache-provider: basic

      - name: Decrypt the debug key
        # Pushes get the repository secrets, so their test builds share one signature and
        # install over each other. Pull requests get no secrets: SDK debug key, no error.
        id: debug_key
        env:
          FORMICA_KEY_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          FORMICA_KEY_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z $FORMICA_KEY_BASE64 || -z $FORMICA_KEY_PASSWORD ]]; then
            if [[ $GITHUB_EVENT_NAME != pull_request ]]; then
              echo "::error::The DEBUG_KEYSTORE_BASE64 or DEBUG_KEYSTORE_PASSWORD secret is missing (keystore/README.md)."
              exit 1
            fi
            echo "No debug key here: the debug APK is signed with the SDK's own debug key."
            exit 0
          fi
          # Checks every step and reports a wrong secret precisely, never its value
          scripts/decrypt-signing-key.sh debug "$RUNNER_TEMP/debug.p12"
          echo "file=$RUNNER_TEMP/debug.p12" >> "$GITHUB_OUTPUT"

      - name: Lint, unit tests, debug and release builds
        env:
          FORMICA_DEBUG_KEYSTORE_FILE: ${{ steps.debug_key.outputs.file }}
          FORMICA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        # A failed download on the runner is retried once; any other error stops the build
        run: >-
          scripts/run-gradle.sh "$RUNNER_TEMP/gradle.log"
          lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Remove the debug key
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.p12" "$RUNNER_TEMP/debug.p12.enc"

      - name: Sign the release APK as the Release workflow does
        # Same script as the release, with a throwaway key made here (no secret): the
        # signing steps are tested on every run, the key is deleted right after
        run: |
          FORMICA_KEYSTORE_PASSWORD=$(openssl rand -hex 24)
          export FORMICA_KEYSTORE_PASSWORD
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.p12" -storetype PKCS12 \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway" \
            -storepass:env FORMICA_KEYSTORE_PASSWORD -keypass:env FORMICA_KEYSTORE_PASSWORD
          status=0
          scripts/sign-apk.sh "$RUNNER_TEMP/throwaway.p12" throwaway \
            app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/release-test-signed.apk" \
            || status=$?
          rm -f "$RUNNER_TEMP/throwaway.p12" "$RUNNER_TEMP/release-test-signed.apk"
          exit "$status"

      - name: Check the debug signing certificate
        if: steps.debug_key.outputs.file
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            > "$RUNNER_TEMP/debug-certs.txt"
          # Public data, embedded in every APK: who the certificate names and its fingerprint
          grep -E 'certificate (DN|SHA-256 digest):' "$RUNNER_TEMP/debug-certs.txt"
          signed=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/debug-certs.txt" | head -n 1)
          expected=$(tr -d ':\n' < keystore/debug-certificate-sha256.txt | tr 'A-F' 'a-f')
          if [[ $signed != "$expected" ]]; then
            echo "::error::Debug APK certificate ($signed) differs from keystore/debug-certificate-sha256.txt ($expected)"
            exit 1
          fi

      - name: Check permissions
        run: |
          scripts/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk
          scripts/check-permissions.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Sample data only in the debug APK
        # The sample data loader lives in the debug source set: the release APK must not
        # declare it, and the debug one must (or this check would prove nothing)
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          release=$("$aapt2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/app-release-unsigned.apk)
          debug=$("$aapt2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk)
          if grep -qF DemoDataActivity <<<"$release"; then
            echo "::error::The release APK declares the sample data loader (DemoDataActivity)"
            exit 1
          fi
          if ! grep -qF DemoDataActivity <<<"$debug"; then
            echo "::error::DemoDataActivity not found in the debug APK: the check above proves nothing"
            exit 1
          fi

      - name: Name the debug APK
        # e.g. formica-debug-0.1.0-a4f9da7.apk: version and commit, to tell test builds apart
        id: debug_apk
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          apk="formica-debug-$version-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The APK itself, not a zip: the artifact is named after the file
          path: ${{ steps.debug_apk.outputs.apk }}
          archive: false

      - name: Room schema committed and up to date
        id: room_schema
        # The build writes the schema of the current database version into app/schemas/;
        # it must match the committed file, or a schema change went without its version,
        # migration or schema file
        run: |
          changes=$(git status --porcelain -- app/schemas)
          if [[ -n $changes ]]; then
            echo "$changes"
            echo "::error::app/schemas differs from the build: commit the new schema file (artifact room-schemas); a changed schema also needs a new database version and its migration."
            exit 1
          fi

      - name: Upload Room schemas
        if: failure() && steps.room_schema.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-schemas
          path: app/schemas/

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
