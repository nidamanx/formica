# Checks that the release build is reproducible: two independent builds of the same
# commit, on two runners and in different conditions (folder, time zone, file mode mask),
# must give the same unsigned APK byte for byte. F-Droid relies on this: it builds the app
# itself and accepts the published signature only if the results match.
# Only when asked: "[reproducibility]" in the message of the last commit of a push to
# develop, or Actions > Reproducibility > Run workflow (once the file is on main).
name: Reproducibility

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only a true/false comes from the commit message: it is never expanded in a command
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reproducibility]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a
            dir: formica
            tz: UTC
            umask: "0022"
          - variant: b
            dir: elsewhere/another-name
            tz: Pacific/Kiritimati
            umask: "0002"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ matrix.dir }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Each build starts from nothing, as F-Droid's does
          cache-disabled: true

      - name: Unsigned release build
        working-directory: ${{ matrix.dir }}
        env:
          TZ: ${{ matrix.tz }}
          UMASK: ${{ matrix.umask }}
        run: |
          umask "$UMASK"
          scripts/run-gradle.sh "$RUNNER_TEMP/gradle.log" assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/formica-unsigned.apk"
          sha256sum "$RUNNER_TEMP/formica-unsigned.apk"

      - name: Keep the APK for the comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.variant }}
          path: ${{ runner.temp }}/formica-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the two APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
          path: apks

      - name: Compare
        run: |
          a=apks/unsigned-a/formica-unsigned.apk
          b=apks/unsigned-b/formica-unsigned.apk
          sum_a=$(sha256sum "$a" | cut -d' ' -f1)
          sum_b=$(sha256sum "$b" | cut -d' ' -f1)
          if [[ $sum_a == "$sum_b" ]]; then
            echo "Reproducible: both builds give the unsigned APK $sum_a" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Which entries of the APK differ: usually a time or a path written into a file
          python3 - "$a" "$b" <<'PY'
          import sys, zipfile
          a, b = (zipfile.ZipFile(p) for p in sys.argv[1:3])
          ea = {i.filename: (i.CRC, i.file_size) for i in a.infolist()}
          eb = {i.filename: (i.CRC, i.file_size) for i in b.infolist()}
          diff = sorted(n for n in ea.keys() | eb.keys() if ea.get(n) != eb.get(n))
          order = [i.filename for i in a.infolist()] != [i.filename for i in b.infolist()]
          lines = diff[:30] or ["(same content: the difference is in the zip metadata"
                                + (" and the order of entries" if order else "") + ")"]
          print("::error title=Not reproducible::" + "%0A".join(lines))
          PY
          exit 1
