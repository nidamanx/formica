# Builds, signs and publishes a release of the versionName in app/build.gradle.kts.
# Started by hand only, on main: Actions > Release > Run workflow. It creates the tag
# v<versionName> itself (the tag ruleset forbids moving or deleting it afterwards).
# Two jobs, on two runners, so that the key is never where Gradle runs:
#  - "build" runs Gradle (third-party plugins and dependencies) with no secret and a
#    read-only token, and produces the unsigned APK;
#  - "publish" never runs Gradle: it decrypts the key (on main only), signs with
#    apksigner, removes the key, checks the certificate, attests the build provenance,
#    then creates the release and its tag.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read and check the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Run the release from main, not from $GITHUB_REF"
            exit 1
          fi
          # Same checks as the Build workflow (versionName X.Y.Z included), plus a released
          # CHANGELOG section
          scripts/check-version.sh --release
          name=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          tag="v$name"
          # Only a "not found" lets the release go on: any other answer is an error
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
            echo "::error::Tag $tag already exists. Increase versionName and versionCode first."
            exit 1
          elif [[ $out != *"HTTP 404"* ]]; then
            echo "::error::Cannot check whether tag $tag exists: $out"
            exit 1
          fi
          {
            echo "name=$name"
            echo "tag=$tag"
            echo "changelog=fastlane/metadata/android/en-US/changelogs/$code.txt"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT-licensed cache: the default "enhanced" one is proprietary since v6
          cache-provider: basic
          # A release starts from a clean state: nothing restored from the caches written
          # by the other workflows
          cache-disabled: true

      # The same tasks run in every Build: a task missing here would show there.
      # Unit tests exist for the debug variant only; they test the same code
      - name: Lint, unit tests and unsigned release build
        # A failed download on the runner is retried once; any other error stops the build
        run: >-
          scripts/run-gradle.sh "$RUNNER_TEMP/gradle.log"
          lintRelease testDebugUnitTest assembleRelease

      - name: Check permissions
        run: scripts/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Keep the unsigned APK for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write           # create the tag and the release
      id-token: write           # sign the build provenance attestation
      attestations: write       # store the attestation
      artifact-metadata: write  # artifact storage record (attest v4)
    env:
      NAME: ${{ needs.build.outputs.name }}
      TAG: ${{ needs.build.outputs.tag }}
      CHANGELOG: ${{ needs.build.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Decrypt the release key
        env:
          FORMICA_KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          FORMICA_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::The release key is used on main only, not on $GITHUB_REF"
            exit 1
          fi
          if [[ -z $FORMICA_KEY_BASE64 || -z $FORMICA_KEY_PASSWORD ]]; then
            echo "::error::The KEYSTORE_BASE64 or KEYSTORE_PASSWORD secret is missing (docs/MAINTAINING.md)."
            exit 1
          fi
          # Checks every step and reports a wrong secret precisely, never its value
          scripts/decrypt-signing-key.sh release "$RUNNER_TEMP/release.p12"

      # The same script signs the release APK with a throwaway key in every Build run
      - name: Sign with apksigner
        env:
          FORMICA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: >-
          scripts/sign-apk.sh "$RUNNER_TEMP/release.p12" formica
          "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" "dist/formica-$NAME.apk"

      - name: Remove the plain key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/release.p12.enc"

      - name: Verify the signature and prepare the files
        run: |
          apk="formica-$NAME.apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "dist/$apk" | tee "$RUNNER_TEMP/certs.txt"

          # The APK must be signed with the key whose fingerprint is published
          signed=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -n 1)
          expected=$(tr -d ':\n' < keystore/certificate-sha256.txt | tr 'A-F' 'a-f')
          if [[ $signed != "$expected" ]]; then
            echo "::error::APK certificate ($signed) differs from keystore/certificate-sha256.txt ($expected)"
            exit 1
          fi
          scripts/check-permissions.sh "dist/$apk"

          (cd dist && sha256sum "$apk" > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/formica-${{ needs.build.outputs.name }}.apk

      - name: Write release notes
        run: |
          apk="formica-$NAME.apk"
          {
            cat "$CHANGELOG"
            echo
            echo "## Verify"
            echo
            echo "SHA-256 of \`$apk\`:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Signing certificate SHA-256 (also in the README):"
            echo
            echo '```'
            cat keystore/certificate-sha256.txt
            echo '```'
            echo
            echo "Build provenance:"
            echo
            echo '```'
            echo "gh attestation verify $apk --repo $GITHUB_REPOSITORY"
            echo '```'
          } > release-notes.md

      # A draft first: nobody sees it and the tag does not exist yet. It becomes public only
      # when every file is there, uploaded and with its size (on 2026-11-25 an upload was
      # lost without any error during a GitHub outage)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --draft \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Formica $NAME" \
            --notes-file release-notes.md

          missing() {  # the files of dist/ not on the draft yet, or with another size
            local have f
            have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.size)"')
            for f in dist/*; do
              grep -qxF "$(basename "$f") $(stat -c %s "$f")" <<<"$have" || echo "$f"
            done
          }
          for attempt in 1 2 3; do
            todo=$(missing)
            [[ -z $todo ]] && break
            echo "::warning::Attempt $attempt: not on the draft yet: $(echo "$todo" | xargs -n1 basename | paste -sd' ')"
            for f in $todo; do
              gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" || true
            done
            sleep 20
          done
          todo=$(missing)
          if [[ -n $todo ]]; then
            echo "::error::The release stays a draft: files missing: $(echo "$todo" | xargs -n1 basename | paste -sd' ')"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
