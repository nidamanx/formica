# Installs and starts the debug app on emulators (the oldest supported Android, a middle
# version and recent ones), checks it does not crash and takes a screenshot of every
# section, in the light and the dark theme and with large text; on Android 16 it also
# takes the store screenshots in every language (scripts/store-screenshots.sh).
# Two ways to start it:
#  - automatically, on a push to develop that changes the app or the build: every level
#    but the experimental ones (public repository: free minutes, jobs in parallel);
#  - by hand: Actions > Emulator smoke test > Run workflow, all levels or one. GitHub
#    shows this button only once the workflow is on the default branch (main).
# Experimental levels run only when asked for by name.
name: Emulator smoke test

on:
  push:
    branches: [develop]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/emulator.yml"
      - "scripts/emulator-smoke.sh"
      - "scripts/emulator-common.sh"
      - "scripts/store-screenshots.sh"
      - "scripts/run-gradle.sh"
  workflow_dispatch:
    inputs:
      only:
        description: "Only this API level (e.g. 26); empty = all but experimental"
        required: false
        default: ""

permissions:
  contents: read

# A newer push makes the running automatic test pointless; manual runs are never cancelled
concurrency:
  group: emulator-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  emulator:
    runs-on: ubuntu-24.04
    # Experimental images may fail for reasons outside the app: reported, not blocking
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      # Jobs not selected start but skip every step (about a minute each).
      # The level asked for by hand, otherwise (also on push) all but the experimental ones
      SELECTED: ${{ inputs.only && inputs.only == format('{0}', matrix.api-level) || !inputs.only && matrix.experimental != true }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 36]
        include:
          # From Android 16 the SDK packages have a minor version: android-37.0
          - api-level: "37.0"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SELECTED == 'true'
        with:
          persist-credentials: false

      - name: Enable KVM
        if: env.SELECTED == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.SELECTED == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: env.SELECTED == 'true'
        with:
          # MIT-licensed cache: the default "enhanced" one is proprietary since v6
          cache-provider: basic
          # The parallel jobs would all try to save the same entry: only build.yml writes it
          cache-read-only: true

      - name: Build debug APK
        if: env.SELECTED == 'true'
        # A failed download on the runner is retried once; other errors become an annotation
        run: scripts/run-gradle.sh "$RUNNER_TEMP/gradle.log" assembleDebug

      - name: Install, start and check
        if: env.SELECTED == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          profile: pixel_6
          disable-animations: true
          # GitHub runners have 4 cores; recent images are very slow with the default 2
          cores: 4
          ram-size: 4096M
          # Recent system images may take longer than the default 600 s to boot
          emulator-boot-timeout: 1200
          disk-size: 4000M
          # Store screenshots (5 languages) on Android 16 only: one set is enough
          script: |
            scripts/emulator-smoke.sh api${{ matrix.api-level }}-phone
            if [ "${{ matrix.api-level }}" = "36" ]; then scripts/store-screenshots.sh; fi

      - name: Upload screenshots
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-api${{ matrix.api-level }}
          path: screenshots/
          if-no-files-found: ignore
